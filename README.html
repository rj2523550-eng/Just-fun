<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Shorts App UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050505;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* मोबाइल फ्रेम */
        .app-container {
            width: 380px;
            height: 720px;
            background: #000;
            position: relative;
            border-radius: 35px;
            overflow: hidden;
            border: 3px solid #222;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* 1. TOP BAR (ऊपर की पट्टी - लोगो, स्टोरीज, मैसेज) */
        .top-section {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            padding: 15px 15px 5px 15px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .app-logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-icons {
            display: flex;
            gap: 15px;
            font-size: 20px;
        }

        .icon-btn {
            position: relative;
            cursor: pointer;
        }

        .badge {
            position: absolute;
            top: -4px;
            right: -6px;
            background: #ff0050;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 10px;
        }

        /* STORIES BAR (WhatsApp / Insta स्टाइल स्टोरीज) */
        .stories-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            padding-bottom: 5px;
        }

        .stories-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #ccc;
            flex-shrink: 0;
        }

        .story-ring {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
            margin-bottom: 4px;
        }

        .story-ring.my-story {
            background: transparent;
            position: relative;
        }

        .add-story-plus {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #0095f6;
            color: #fff;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            border: 2px solid #000;
        }

        .story-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #333;
            border: 2px solid #000;
        }

        /* 2. MAIN VIDEO DISPLAY (वीडियो एरिया) */
        .video-screen {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #2a2a2a 0%, #111 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 14px;
        }

        /* 3. RIGHT SIDEBAR (दाएँ तरफ के बटन्स) */
        .right-actions {
            position: absolute;
            right: 12px;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            z-index: 10;
        }

        .action-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .btn-circle {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin-bottom: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 4. BOTTOM LEFT DETAILS (यूज़र डिटेल और कैप्शन) */
        .bottom-info {
            position: absolute;
            left: 15px;
            bottom: 75px;
            right: 80px;
            z-index: 10;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .user-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ff0050;
        }

        .user-name {
            font-weight: 600;
            font-size: 13px;
        }

        .follow-badge {
            border: 1px solid #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }

        .video-caption {
            font-size: 12px;
            margin-bottom: 8px;
            line-height: 1.3;
            color: #eee;
        }

        .audio-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #ccc;
        }

        /* 5. BOTTOM NAVIGATION (नेविगेशन बार) */
        .bottom-nav-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 0.5px solid #222;
            z-index: 10;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #777;
        }

        .nav-tab.active {
            color: #fff;
        }

        .nav-tab .tab-icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        .plus-btn {
            background: linear-gradient(45deg, #ff0050, #00f2fe);
            width: 42px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- [1] TOP SECTION (Header + Stories) -->
        <div class="top-section">
            <div class="header-bar">
                <div class="app-logo">ShortsApp</div>
                <div class="top-icons">
                    <span class="icon-btn">📷</span>
                    <span class="icon-btn">⚡</span>
                    <!-- मैसेजिंग (DM/Inbox) आइकन -->
                    <span class="icon-btn">💬 <span class="badge">3</span></span>
                </div>
            </div>

            <!-- STORIES BAR -->
            <div class="stories-container">
                <!-- आपकी स्टोरी जोड़ने का ऑप्शन -->
                <div class="story-item">
                    <div class="story-ring my-story">
                        <div class="story-img"></div>
                        <div class="add-story-plus">+</div>
                    </div>
                    <span>आपकी स्टोरी</span>
                </div>

                <!-- दोस्तों की स्टोरीज़ -->
                <div class="story-item">
                    <div class="story-ring"><div class="story-img"></div></div>
                    <span>rahul_01</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><div class="story-img"></div></div>
                    <span>priya_v</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><div class="story-img"></div></div>
                    <span>tech_guy</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><div class="story-img"></div></div>
                    <span>vlogs_in</span>
                </div>
            </div>
        </div>

        <!-- [2] MAIN VIDEO AREA -->
        <div class="video-screen">
            [ फुल-स्क्रीन वीडियो प्ले एरिया ]
        </div>

        <!-- [3] RIGHT SIDEBAR (Interactive Actions) -->
        <div class="right-actions">
            <div class="action-box">
                <div class="btn-circle">❤️</div>
                <span>24.8K</span>
            </div>
            <div class="action-box">
                <div class="btn-circle">💭</div>
                <span>1,200</span>
            </div>
            <div class="action-box">
                <div class="btn-circle">🔖</div>
                <span>Save</span>
            </div>
            <div class="action-box">
                <div class="btn-circle">✈️</div>
                <span>Share</span>
            </div>
            <div class="action-box">
                <div class="btn-circle">🎵</div>
                <span>Music</span>
            </div>
        </div>

        <!-- [4] BOTTOM LEFT DETAILS -->
        <div class="bottom-info">
            <div class="user-row">
                <div class="user-avatar"></div>
                <span class="user-name">@creator_official</span>
                <span class="follow-badge">Follow</span>
            </div>
            <div class="video-caption">
                नया शार्ट वीडियो कैसा लगा? 🚀 #viral #trending #shorts
            </div>
            <div class="audio-tag">
                🎵 <span>Original Sound - creator_official</span>
            </div>
        </div>

        <!-- [5] BOTTOM NAVIGATION BAR -->
        <div class="bottom-nav-bar">
            <div class="nav-tab active">
                <span class="tab-icon">🏠</span>
                <span>Home</span>
            </div>
            <div class="nav-tab">
                <span class="tab-icon">🔍</span>
                <span>Discover</span>
            </div>
            <div class="plus-btn">+</div>
            <div class="nav-tab">
                <span class="tab-icon">🔔</span>
                <span>Alerts</span>
            </div>
            <div class="nav-tab">
                <span class="tab-icon">👤</span>
                <span>Profile</span>
            </div>
        </div>

    </div>

</body>
</html>
