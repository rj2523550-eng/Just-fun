<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Reels UI Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        /* फुल-स्क्रीन ऐप कंटेनर */
        .app-container {
            width: 100vw;
            height: 100vh;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 1. TOP HEADER (Instagram स्टाइल) */
        .top-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 15px 16px 10px 16px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 100%);
        }

        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .top-icons {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 20px;
        }

        .icon-btn {
            position: relative;
            cursor: pointer;
        }

        .unread-badge {
            position: absolute;
            top: -4px;
            right: -6px;
            background: #ff3040;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 10px;
        }

        /* STORIES BAR (WhatsApp / Insta स्टाइल) */
        .stories-bar {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 5px;
        }

        .stories-bar::-webkit-scrollbar {
            display: none;
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #fff;
            flex-shrink: 0;
            width: 62px;
        }

        .story-ring {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            margin-bottom: 4px;
        }

        .story-ring.my-story {
            background: transparent;
            position: relative;
        }

        .add-icon {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #0095f6;
            color: #fff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid #000;
        }

        .story-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #262626;
            border: 2px solid #000;
        }

        .story-username {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
        }

        /* 2. MAIN VIDEO FEED AREA */
        .video-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #666;
            font-size: 16px;
            z-index: 1;
        }

        /* 3. RIGHT SIDEBAR (Instagram Reels Actions) */
        .right-sidebar {
            position: absolute;
            right: 12px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            z-index: 20;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .action-icon {
            font-size: 26px;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .audio-disc {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: #333;
            margin-top: 10px;
        }

        /* 4. BOTTOM LEFT DETAILS (Creator Info) */
        .bottom-details {
            position: absolute;
            left: 16px;
            bottom: 75px;
            right: 80px;
            z-index: 20;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .user-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #444;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .username-text {
            font-weight: 600;
            font-size: 14px;
        }

        .follow-btn {
            border: 1px solid #fff;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
        }

        .caption-text {
            font-size: 13px;
            margin-bottom: 10px;
            line-height: 1.4;
            color: #f1f1f1;
        }

        .audio-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #e0e0e0;
        }

        /* 5. BOTTOM NAVIGATION BAR */
        .bottom-navbar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 55px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 0.5px solid #1a1a1a;
            z-index: 30;
        }

        .nav-btn {
            font-size: 22px;
            color: #8e8e8e;
            cursor: pointer;
        }

        .nav-btn.active {
            color: #fff;
        }

        .create-plus-btn {
            width: 38px;
            height: 26px;
            border-radius: 8px;
            background: linear-gradient(45deg, #ff0050, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- TOP HEADER & STORIES -->
        <div class="top-header">
            <div class="header-top-row">
                <div class="app-title">Reels</div>
                <div class="top-icons">
                    <span class="icon-btn">📷</span>
                    <span class="icon-btn">💬 <span class="unread-badge">3</span></span>
                </div>
            </div>

            <!-- STORIES -->
            <div class="stories-bar">
                <div class="story-item">
                    <div class="story-ring my-story">
                        <div class="story-avatar"></div>
                        <div class="add-icon">+</div>
                    </div>
                    <span class="story-username">आपकी स्टोरी</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><div class="story-avatar"></div></div>
                    <span class="story-username">rahul_01</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><div class="story-avatar"></div></div>
                    <span class="story-username">priya_v</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><div class="story-avatar"></div></div>
                    <span class="story-username">tech_guy</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><div class="story-avatar"></div></div>
                    <span class="story-username">vlogs_in</span>
                </div>
            </div>
        </div>

        <!-- VIDEO FEED AREA -->
        <div class="video-feed">
            [ फुल-स्क्रीन वीडियो प्ले एरिया ]
        </div>

        <!-- RIGHT SIDEBAR (ACTIONS) -->
        <div class="right-sidebar">
            <div class="action-item">
                <span class="action-icon">❤️</span>
                <span>24.8K</span>
            </div>
            <div class="action-item">
                <span class="action-icon">💬</span>
                <span>1,200</span>
            </div>
            <div class="action-item">
                <span class="action-icon">✈️</span>
                <span>Share</span>
            </div>
            <div class="action-item">
                <span class="action-icon">🔖</span>
                <span>Save</span>
            </div>
            <div class="action-item">
                <div class="audio-disc"></div>
            </div>
        </div>

        <!-- BOTTOM DETAILS -->
        <div class="bottom-details">
            <div class="user-profile">
                <div class="user-pic"></div>
                <span class="username-text">@creator_official</span>
                <button class="follow-btn">Follow</button>
            </div>
            <div class="caption-text">
                नया शार्ट वीडियो कैसा लगा? 🚀 #viral #trending #reels
            </div>
            <div class="audio-info">
                🎵 <span>Original Sound - creator_official</span>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <div class="bottom-navbar">
            <div class="nav-btn active">🏠</div>
            <div class="nav-btn">🔍</div>
            <div class="create-plus-btn">+</div>
            <div class="nav-btn">🔔</div>
            <div class="nav-btn">👤</div>
        </div>

    </div>

</body>
</html>
