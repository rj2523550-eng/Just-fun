<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram Reels UI Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 1. TOP HEADER */
        .top-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 15px 16px 10px 16px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 100%);
        }

        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .top-icons {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 20px;
        }

        .icon-btn {
            position: relative;
            cursor: pointer;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
        }

        .icon-btn:active {
            transform: scale(0.85);
        }

        .unread-badge {
            position: absolute;
            top: -4px;
            right: -6px;
            background: #ff3040;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(255, 48, 64, 0.5);
        }

        /* STORIES BAR */
        .stories-bar {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 5px;
        }

        .stories-bar::-webkit-scrollbar {
            display: none;
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: #fff;
            flex-shrink: 0;
            width: 62px;
            cursor: pointer;
        }

        .story-ring {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            margin-bottom: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .story-ring.my-story {
            background: transparent;
            position: relative;
        }

        .add-icon {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #0095f6;
            color: #fff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid #000;
        }

        .story-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #262626;
            border: 2px solid #000;
        }

        .story-username {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* 2. VIDEO AREA & DOUBLE TAP HEART ANIMATION */
        .video-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            cursor: pointer;
        }

        .video-feed video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Double Tap Popup Heart Animation */
        .pop-heart {
            position: absolute;
            font-size: 90px;
            color: #ff3040;
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            z-index: 5;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        .pop-heart.active {
            opacity: 1;
            transform: scale(1.2);
        }

        /* 3. RIGHT SIDEBAR (Attractive Instagram Buttons) */
        .right-sidebar {
            position: absolute;
            right: 12px;
            bottom: 75px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            z-index: 20;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .action-icon {
            font-size: 26px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 4px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .action-icon:active {
            transform: scale(0.85);
            background: rgba(255, 255, 255, 0.25);
        }

        /* Active/Liked/Saved States */
        .action-icon.liked {
            color: #ff3040;
            background: rgba(255, 48, 64, 0.2);
            border-color: rgba(255, 48, 64, 0.4);
        }

        .action-icon.saved {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.4);
        }

        .audio-disc {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: #222;
            margin-top: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* 4. BOTTOM LEFT DETAILS */
        .bottom-details {
            position: absolute;
            left: 16px;
            bottom: 75px;
            right: 80px;
            z-index: 20;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .user-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #444;
            border: 1.5px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .username-text {
            font-weight: 600;
            font-size: 14px;
        }

        .follow-btn {
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            color: #fff;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .follow-btn.following {
            background: rgba(255, 255, 255, 0.2);
            border-color: transparent;
        }

        .caption-text {
            font-size: 13px;
            margin-bottom: 10px;
            line-height: 1.4;
            color: #f1f1f1;
        }

        .audio-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #e0e0e0;
        }

        /* 5. BOTTOM NAVIGATION BAR */
        .bottom-navbar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 55px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 0.5px solid #1a1a1a;
            z-index: 30;
        }

        .nav-btn {
            font-size: 22px;
            color: #8e8e8e;
            cursor: pointer;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .nav-btn.active, .nav-btn:active {
            color: #fff;
            transform: scale(1.1);
        }

        .create-plus-btn {
            width: 40px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(45deg, #ff0050, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(0, 242, 254, 0.3);
            transition: transform 0.2s ease;
        }

        .create-plus-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- TOP HEADER & STORIES -->
        <div class="top-header">
            <div class="header-top-row">
                <div class="app-title">Reels</div>
                <div class="top-icons">
                    <span class="icon-btn" id="cameraBtn">📷</span>
                    <span class="icon-btn" id="messageBtn">💬 <span class="unread-badge">3</span></span>
                </div>
            </div>

            <!-- STORIES BAR -->
            <div class="stories-bar">
                <div class="story-item">
                    <div class="story-ring my-story">
                        <div class="story-avatar"></div>
                        <div class="add-icon">+</div>
                    </div>
                    <span class="story-username">आपकी स्टोरी</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><div class="story-avatar"></div></div>
                    <span class="story-username">rahul_01</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><div class="story-avatar"></div></div>
                    <span class="story-username">priya_v</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><div class="story-avatar"></div></div>
                    <span class="story-username">tech_guy</span>
                </div>
                <div class="story-item">
                    <div class="story-ring"><div class="story-avatar"></div></div>
                    <span class="story-username">vlogs_in</span>
                </div>
            </div>
        </div>

        <!-- VIDEO AREA (Real Video Stream) -->
        <div class="video-feed" id="videoFeed">
            <video id="myVideo" autoplay loop muted playsinline>
                <source src="https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-1232-large.mp4" type="video/mp4">
            </video>
            <div class="pop-heart" id="popHeart">❤️</div>
        </div>

        <!-- RIGHT SIDEBAR (Interactive Buttons with IDs) -->
        <div class="right-sidebar">
            <div class="action-item">
                <span class="action-icon" id="likeBtn">🤍</span>
                <span id="likeCount">24.8K</span>
            </div>
            <div class="action-item">
                <span class="action-icon" id="commentBtn">💬</span>
                <span>1,200</span>
            </div>
            <div class="action-item">
                <span class="action-icon" id="shareBtn">✈️</span>
                <span>Share</span>
            </div>
            <div class="action-item">
                <span class="action-icon" id="saveBtn">🔖</span>
                <span>Save</span>
            </div>
            <div class="action-item">
                <div class="audio-disc"></div>
            </div>
        </div>

        <!-- BOTTOM DETAILS -->
        <div class="bottom-details">
            <div class="user-profile">
                <div class="user-pic"></div>
                <span class="username-text">@creator_official</span>
                <button class="follow-btn" id="followBtn">Follow</button>
            </div>
            <div class="caption-text">
                नया शार्ट वीडियो कैसा लगा? 🚀 #viral #trending #reels
            </div>
            <div class="audio-info">
                🎵 <span>Original Sound - creator_official</span>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <div class="bottom-navbar">
            <div class="nav-btn active" id="homeBtn">🏠</div>
            <div class="nav-btn" id="searchBtn">🔍</div>
            <div class="create-plus-btn" id="createBtn">+</div>
            <div class="nav-btn" id="notificationBtn">🔔</div>
            <div class="nav-btn" id="profileBtn">👤</div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // सभी बटन्स के रिफरेंस
        const likeBtn = document.getElementById('likeBtn');
        const likeCountEl = document.getElementById('likeCount');
        const saveBtn = document.getElementById('saveBtn');
        const followBtn = document.getElementById('followBtn');
        const videoFeed = document.getElementById('videoFeed');
        const popHeart = document.getElementById('popHeart');
        const myVideo = document.getElementById('myVideo');

        let isLiked = false;
        let isSaved = false;
        let isFollowing = false;
        let count = 24800;

        // 1. LIKE BUTTON LOGIC
        likeBtn.addEventListener('click', toggleLike);

        function toggleLike() {
            isLiked = !isLiked;
            if (isLiked) {
                likeBtn.textContent = '❤️';
                likeBtn.classList.add('liked');
                count++;
            } else {
                likeBtn.textContent = '🤍';
                likeBtn.classList.remove('liked');
                count--;
            }
            likeCountEl.textContent = (count / 1000).toFixed(1) + 'K';
        }

        // 2. DOUBLE TAP ON VIDEO TO LIKE
        let lastTap = 0;
        videoFeed.addEventListener('click', function (e) {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            
            if (tapLength < 300 && tapLength > 0) {
                if (!isLiked) toggleLike();
                showPopHeart();
            } else {
                // सिंगल टैप से वीडियो म्यूट/अनम्यूट
                myVideo.muted = !myVideo.muted;
            }
            lastTap = currentTime;
        });

        function showPopHeart() {
            popHeart.classList.add('active');
            setTimeout(() => {
                popHeart.classList.remove('active');
            }, 800);
        }

        // 3. SAVE / BOOKMARK LOGIC
        saveBtn.addEventListener('click', function() {
            isSaved = !isSaved;
            if (isSaved) {
                saveBtn.classList.add('saved');
                saveBtn.textContent = '🔖';
            } else {
                saveBtn.classList.remove('saved');
            }
        });

        // 4. FOLLOW BUTTON LOGIC
        followBtn.addEventListener('click', function() {
            isFollowing = !isFollowing;
            if (isFollowing) {
                followBtn.textContent = 'Following';
                followBtn.classList.add('following');
            } else {
                followBtn.textContent = 'Follow';
                followBtn.classList.remove('following');
            }
        });
    </script>

</body>
</html>
